name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Pruebas automáticas
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DobermanAntivirus.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          path: dist/DobermanAntivirus.apk
          archive: false
          retention-days: 30
